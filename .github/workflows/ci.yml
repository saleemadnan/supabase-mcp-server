name: CI

on:
  push:
    branches:
      - main
      - refactor/misc
  pull_request:
    branches:
      - main
      - refactor/misc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Unit-test-only placeholders. Integration tests remain excluded with -m "not integration".
      SUPABASE_PROJECT_REF: abcdefghijklmnopqrst
      SUPABASE_DB_PASSWORD: ci_dummy_password
      SUPABASE_ACCESS_TOKEN: ci_dummy_access_token
      SUPABASE_SERVICE_ROLE_KEY: ci_dummy_service_role_key
      SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      DATABASE_URL: postgresql://postgres:ci_dummy_password@db.abcdefghijklmnopqrst.supabase.co:5432/postgres

    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Create venv and install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run python -m pytest -m "not integration" --tb=short -q --cov=supabase_mcp --cov-report=xml --cov-report=term-missing

      - name: Run Ruff lint (informational)
        continue-on-error: true
        run: uv run ruff check . --output-format=github

      - name: Check Ruff formatting (informational)
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
