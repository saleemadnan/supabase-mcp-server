name: SonarQube

on:
  push:
    branches:
      - main
      - refactor/misc
  pull_request:
    branches:
      - main
      - refactor/misc
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check SonarQube secrets
        id: sonar-secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube secrets are not configured. Skipping scan without failing the workflow."
          fi

      - name: Checkout repository
        if: steps.sonar-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        if: steps.sonar-secrets.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.sonar-secrets.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        if: steps.sonar-secrets.outputs.configured == 'true'
        run: uv sync --group dev

      - name: Generate coverage report
        if: steps.sonar-secrets.outputs.configured == 'true'
        run: uv run python -m pytest -m "not integration" --tb=short -q --cov=supabase_mcp --cov-report=xml

      - name: Run SonarQube scan
        if: steps.sonar-secrets.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
